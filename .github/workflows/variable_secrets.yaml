name: Exploring Variables and Secrets

on: push

# this is env defined at Workflow level
env:
    CONTAINER_REGISTRY: docker.io
    DOCKER_USERNAME: siddharth1
    DOCKER_PASSWORD: test2323
    IMAGE_NAME: github-actions-nginx

jobs:
  docker:
    runs-on: ubuntu-latest
    # this is env defined at job level
    # env:
    #   CONTAINER_REGISTRY: docker.io
    #   DOCKER_USERNAME: siddharth1
    #   DOCKER_PASSWORD: test2323
    #   IMAGE_NAME: github-actions-nginx
    steps:
      - name: Docker Build
        # this is env defined at step level 
        # env:
        #   CONTAINER_REGISTRY: docker.io
        #   DOCKER_USERNAME: siddharth1
        #   IMAGE_NAME: github-actions-nginx
        run: |
          docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

      - name: Docker Login
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker login --username=${DOCKER_USERNAME} \
                        --password=${DOCKER_PASSWORD}

      - name: Docker Publish
        run: |
          docker push $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    env:
      CONTAINER_REGISTRY: docker.io
      DOCKER_USERNAME: siddharth1
      IMAGE_NAME: github-actions-nginx
    steps:
      - name: Docker Run
        run: |
          docker run -d -p 8080:80 \
            $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest