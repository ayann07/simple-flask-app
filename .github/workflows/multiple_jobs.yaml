name: Multiple Work flow # The title that appears in your GitHub Actions dashboard

on:
  push: # The trigger: this workflow starts automatically when code is pushed

jobs:

  # ----------------------------------------
  # JOB 1: The Build Phase
  # ----------------------------------------
  build_job_1:
    runs-on: ubuntu-latest # Requests a fresh, empty Linux server from GitHub
    steps:
      - name: Install Cowsay Program
        # Runs standard Linux commands to download/install the 'cowsay' package.
        # The '-y' flag automatically answers "yes" to any installation prompts.
        run: sudo apt-get install cowsay -y

      - name: Execute Cowsay Command
        # Runs the installed program to generate an ASCII dragon.
        # The '>> dragon.txt' part takes the output and saves it into a text file instead of printing it.
        run: cowsay -f dragon "Run for cover, I am a DRAGON... RAWR" >> dragon.txt
    
      - name: Upload Dragon text file
        # Because the next job runs on a totally different server, we must save the file to GitHub's storage.
        uses: actions/upload-artifact@v7
        with:
            name: dragon-text-file # We name the artifact bundle so we can find it later
            path: dragon.txt       # The actual file on the server we want to upload

  # ----------------------------------------
  # JOB 2: The Testing Phase
  # ----------------------------------------
  test_job_2:
    needs: build_job_1 # CRITICAL: Forces this job to pause and wait for build_job_1 to finish successfully!
    runs-on: ubuntu-latest # Requests a SECOND, brand new Linux server
    steps:
      - name: Download Dragon text file
        # Downloads the saved file from GitHub's storage onto this new server
        uses: actions/download-artifact@v7
        with:
            name: dragon-text-file # Must match the name used in the upload step

      - name: Test File Exists
        # 'grep' searches for text inside a file. '-i' means case-insensitive.
        # It searches for "dragon" inside "dragon.txt". If it doesn't find it, the command fails, which stops the whole workflow.
        run: grep -i "dragon" dragon.txt

  # ----------------------------------------
  # JOB 3: The Deployment Phase
  # ----------------------------------------
  deploy_job_3:
    needs: [build_job_1, test_job_2] # Forces this job to wait until BOTH the build and test jobs pass!
    runs-on: ubuntu-latest # Requests a THIRD, brand new Linux server
    steps:
      - name: Download Dragon text file
        # Once again, we must download the file because we are on a new server
        uses: actions/download-artifact@v7
        with:
            name: dragon-text-file
            
      - name: Read File
        # 'cat' reads the file and prints its contents (our ASCII dragon) to the action logs
        run: cat dragon.txt
        
      - name: Deploy
        # Simply prints "Deploying..." to simulate finalizing the process
        run: echo "Deploying..."